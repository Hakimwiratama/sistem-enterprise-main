services:
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DB_HOST: product-db
      DB_USER: appuser
      DB_PORT: 3306
      DB_PASSWORD: password
      DB_NAME: productdb
    depends_on:
      product-db:
        condition: service_healthy

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      APP_NAME: cart-service
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: cart-db
      DB_PORT: 5432
      DB_DATABASE: cartdb
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    depends_on:
      cart-db:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      APP_NAME: order-service
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: order-db
      DB_PORT: 3306
      DB_DATABASE: ordersdb
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword
      CART_SERVICE_URL: http://cart-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3000
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    depends_on:
      order-db:
        condition: service_healthy
      cart-service:
        condition: service_started
      product-service:
        condition: service_started

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      FLASK_DEBUG: "0"
      MONGO_URI: mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      MONGO_DB_NAME: reviewdb
      PRODUCT_SERVICE_URL: http://product-service:3000
    depends_on:
      review-db:
        condition: service_healthy
      product-service:
        condition: service_started

  order-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ordersdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: orderrootpassword
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - order-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 5
      start_period: 60s
      timeout: 5s

  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cartdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  review-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: appuser
      MONGO_INITDB_ROOT_PASSWORD: apppassword
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  product-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  order-mysql-data:
  cart-db-data:
  review-db-data:
  product-db-data:
